<style>
#aha-form-directions {
  --aha-bg: light-dark(#f4f6f9, #17232b);
  --aha-surface: light-dark(#ffffff, #20313a);
  --aha-ink: light-dark(#182638, #eef4f6);
  --aha-muted: light-dark(#526176, #b9cbd3);
  --aha-line: light-dark(#dce4eb, #455d68);
  --aha-soft: light-dark(#eef3f5, #2d414c);
  --aha-brand: light-dark(#0e766e, #70d8c8);
  --aha-brand-ink: light-dark(#ffffff, #11372f);
  --aha-tint: light-dark(#eaf6f2, #294a45);
  --aha-shadow: light-dark(#1634471a, #00000040);
  --aha-rounding: 10px;
  color: var(--aha-ink);
  font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.55;
}
#aha-form-directions * { box-sizing: border-box; }
#aha-form-directions [hidden] { display: none !important; }
#aha-form-directions .aha-stage { min-height: 490px; padding: 20px; }
#aha-form-directions .aha-surface {
  padding: 24px;
  border: 1px solid var(--aha-line);
  border-radius: 14px;
  background: var(--aha-surface);
  color: var(--aha-ink);
}
#aha-form-directions .aha-heading { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
#aha-form-directions .aha-heading strong { font-size: 18px; font-weight: 600; }
#aha-form-directions .aha-meta { color: var(--aha-muted); font-size: 13px; }
#aha-form-directions .aha-heading .aha-meta { margin-left: auto; }
#aha-form-directions button, #aha-form-directions input { font: inherit; color: inherit; }
#aha-form-directions button { -webkit-tap-highlight-color: transparent; }
#aha-form-directions .aha-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; }
#aha-form-directions .aha-field { position: relative; min-width: 0; }
#aha-form-directions .aha-label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: var(--aha-muted); }
#aha-form-directions .aha-trigger {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px;
  padding: 10px 12px; border: 1px solid var(--aha-line); border-radius: var(--aha-rounding);
  background: var(--aha-surface); text-align: left; font-size: 15px;
  transition: border-color 120ms, background 120ms;
}
#aha-form-directions .aha-trigger:hover { border-color: var(--aha-brand); background: var(--aha-tint); }
#aha-form-directions .aha-trigger[aria-expanded='true'] { border-color: var(--aha-brand); background: var(--aha-tint); }
#aha-form-directions .aha-trigger .aha-value { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#aha-form-directions .aha-trigger svg { width: 17px; height: 17px; flex: 0 0 17px; }
#aha-form-directions .aha-chevron { color: var(--aha-muted); margin-left: auto; }
#aha-form-directions .aha-date-caption { display: block; margin-top: 8px; color: var(--aha-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
#aha-form-directions .aha-footer { display: flex; align-items: end; flex-wrap: wrap; gap: 18px; margin-top: 23px; }
#aha-form-directions .aha-scope { display: flex; padding: 4px; border-radius: var(--aha-rounding); background: var(--aha-soft); gap: 4px; }
#aha-form-directions .aha-scope button {
  min-height: 38px; padding: 7px 12px; background: transparent; border: 1px solid transparent;
  border-radius: calc(var(--aha-rounding) - 3px); color: var(--aha-muted); font-size: 14px;
}
#aha-form-directions .aha-scope button[aria-pressed='true'] { background: var(--aha-surface); color: var(--aha-brand); border-color: var(--aha-line); box-shadow: 0 2px 5px var(--aha-shadow); font-weight: 500; }
#aha-form-directions .aha-action { min-height: 46px; padding: 10px 18px; border: 1px solid var(--aha-brand); border-radius: var(--aha-rounding); background: var(--aha-brand); color: var(--aha-brand-ink); margin-left: auto; font-weight: 500; }
#aha-form-directions .aha-status { min-height: 23px; margin: 16px 0 0; color: var(--aha-muted); font-size: 13px; }
#aha-form-directions .aha-popover {
  position: absolute; left: 0; right: 0; top: calc(100% + 7px); z-index: 8;
  border: 1px solid var(--aha-line); border-radius: 12px; padding: 7px;
  background: var(--aha-surface); color: var(--aha-ink); box-shadow: 0 10px 28px var(--aha-shadow);
}
#aha-form-directions .aha-project-panel { top: 78px; min-width: 245px; }
#aha-form-directions .aha-search-wrap { display: flex; align-items: center; gap: 8px; padding: 7px 8px 12px; border-bottom: 1px solid var(--aha-line); margin-bottom: 6px; color: var(--aha-muted); }
#aha-form-directions .aha-search-wrap svg { width: 17px; height: 17px; flex: 0 0 17px; }
#aha-form-directions .aha-search { border: 0; background: var(--aha-surface); min-width: 0; width: 100%; padding: 3px; font-size: 15px; }
#aha-form-directions .aha-search::placeholder { color: var(--aha-muted); }
#aha-form-directions .aha-project-list { display: grid; gap: 3px; }
#aha-form-directions .aha-option { display: flex; align-items: center; gap: 10px; border: 0; width: 100%; min-height: 41px; padding: 8px 10px; border-radius: 7px; background: var(--aha-surface); text-align: left; font-size: 14px; }
#aha-form-directions .aha-option:hover, #aha-form-directions .aha-option[aria-selected='true'] { background: var(--aha-tint); color: var(--aha-brand); }
#aha-form-directions .aha-option .aha-check { margin-left: auto; width: 16px; height: 16px; }
#aha-form-directions .aha-empty { color: var(--aha-muted); font-size: 14px; padding: 14px 10px; }
#aha-form-directions .aha-date-panel { left: auto; right: 0; width: min(416px, calc(100vw - 72px)); padding: 14px; }
#aha-form-directions .aha-presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 16px; }
#aha-form-directions .aha-preset { border: 1px solid var(--aha-line); background: var(--aha-surface); border-radius: 7px; padding: 6px 9px; min-height: 35px; font-size: 13px; }
#aha-form-directions .aha-preset[aria-pressed='true'] { background: var(--aha-tint); color: var(--aha-brand); border-color: var(--aha-brand); }
#aha-form-directions .aha-time-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
#aha-form-directions .aha-time-choice { text-align: left; background: var(--aha-surface); border: 1px solid var(--aha-line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
#aha-form-directions .aha-time-choice[aria-pressed='true'] { border-color: var(--aha-brand); background: var(--aha-tint); }
#aha-form-directions .aha-time-choice small { display: block; font-size: 12px; color: var(--aha-muted); margin-bottom: 4px; }
#aha-form-directions .aha-month { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 14px 0 8px; font-size: 14px; font-weight: 500; }
#aha-form-directions .aha-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
#aha-form-directions .aha-days .aha-weekday { text-align: center; color: var(--aha-muted); font-size: 12px; padding: 5px 0; }
#aha-form-directions .aha-day { min-height: 32px; border: 0; border-radius: 6px; background: var(--aha-surface); font-size: 13px; padding: 4px 0; }
#aha-form-directions .aha-day[aria-pressed='true'] { background: var(--aha-brand); color: var(--aha-brand-ink); }
#aha-form-directions .aha-day.in-range { background: var(--aha-tint); }
#aha-form-directions .aha-day.outside { color: var(--aha-muted); opacity: .65; }
#aha-form-directions .aha-time-bottom { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 12px; border-top: 1px solid var(--aha-line); padding-top: 12px; }
#aha-form-directions .aha-follow { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--aha-muted); }
#aha-form-directions .aha-follow input { accent-color: var(--aha-brand); width: 16px; height: 16px; }
#aha-form-directions .aha-date-confirm { background: var(--aha-brand); color: var(--aha-brand-ink); border: 0; border-radius: 7px; min-height: 36px; padding: 7px 13px; margin-left: auto; font-size: 14px; }
#aha-form-directions .aha-compact .aha-fields { display: flex; flex-wrap: wrap; gap: 10px; }
#aha-form-directions .aha-compact .aha-field { flex: 1; min-width: 190px; }
#aha-form-directions .aha-compact .aha-label { display: none; }
#aha-form-directions .aha-compact .aha-trigger { background: var(--aha-soft); border-color: transparent; }
#aha-form-directions .aha-compact .aha-project-panel { top: 53px; }
#aha-form-directions .aha-compact .aha-footer { padding-top: 18px; border-top: 1px solid var(--aha-line); }
#aha-form-directions .aha-compact .aha-scope { background: var(--aha-surface); padding: 0; }
#aha-form-directions .aha-compact .aha-scope button { border-radius: 100px; border-color: var(--aha-line); }
#aha-form-directions .aha-compact .aha-scope button[aria-pressed='true'] { background: var(--aha-tint); border-color: var(--aha-brand); box-shadow: none; }
@media (max-width: 540px) {
  #aha-form-directions .aha-stage { min-height: 670px; padding: 12px; }
  #aha-form-directions .aha-surface { padding: 18px; }
  #aha-form-directions .aha-fields { grid-template-columns: 1fr; gap: 17px; }
  #aha-form-directions .aha-heading { margin-bottom: 18px; flex-wrap: wrap; }
  #aha-form-directions .aha-project-panel { min-width: 0; }
  #aha-form-directions .aha-footer { align-items: center; }
  #aha-form-directions .aha-action { margin-left: 0; width: 100%; }
  #aha-form-directions .aha-date-panel { width: calc(100vw - 60px); right: -6px; }
}
@media (prefers-reduced-motion: reduce) { #aha-form-directions .aha-trigger { transition: none; } }
</style>
<div id="aha-form-directions" class="viz-carousel viz-dotted-background" aria-label="aha 表单设计方向" data-previous-label="上一个方案" data-next-label="下一个方案">
  <section data-variant="清爽表单" class="aha-stage" aria-label="清爽表单方案">
    <div class="aha-surface" data-demo="clear">
      <div class="aha-heading"><strong>筛选条件</strong><span class="aha-meta">北京时间</span></div>
      <div class="aha-fields">
        <div class="aha-field">
          <span class="aha-label" id="aha-clear-project-label">项目</span>
          <button type="button" class="aha-trigger cursor-interaction" data-project-trigger aria-labelledby="aha-clear-project-label aha-clear-project-value" aria-expanded="true" aria-controls="aha-clear-project-panel"><i data-lucide="folder" aria-hidden="true"></i><span class="aha-value" id="aha-clear-project-value" data-project-value>全部项目</span><i data-lucide="chevron-down" class="aha-chevron" aria-hidden="true"></i></button>
          <div class="aha-popover aha-project-panel" id="aha-clear-project-panel" data-project-panel>
            <div class="aha-search-wrap"><i data-lucide="search" aria-hidden="true"></i><input class="aha-search" type="text" placeholder="搜索项目名称…" aria-label="搜索项目" role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="aha-clear-project-list" data-project-search></div>
            <div class="aha-project-list" id="aha-clear-project-list" role="listbox" aria-label="项目" data-project-list></div>
          </div>
        </div>
        <div class="aha-field">
          <span class="aha-label" id="aha-clear-time-label">时间范围</span>
          <button type="button" class="aha-trigger cursor-interaction" data-date-trigger aria-labelledby="aha-clear-time-label aha-clear-time-value" aria-expanded="false" aria-controls="aha-clear-date-panel"><i data-lucide="calendar-days" aria-hidden="true"></i><span class="aha-value" id="aha-clear-time-value" data-date-value>近 7 天</span><i data-lucide="chevron-down" class="aha-chevron" aria-hidden="true"></i></button>
          <span class="aha-date-caption" data-date-caption>10/23 00:00 — 10/29 10:23</span>

      <div class="aha-footer"><div><span class="aha-label">用量范围</span><div class="aha-scope" role="group" aria-label="用量范围"><button type="button" class="cursor-interaction" aria-pressed="true" data-scope="可用用量">可用用量</button><button type="button" class="cursor-interaction" aria-pressed="false" data-scope="全部用量">全部用量</button></div></div><button type="button" class="aha-action cursor-interaction" data-apply>更新预览</button></div>
      <p class="aha-status" role="status" aria-live="polite" data-status></p>
    </div>
  </section>
  <section data-variant="紧凑工具栏" class="aha-stage" aria-label="紧凑工具栏方案" hidden>
    <div class="aha-surface aha-compact" data-demo="compact">
      <div class="aha-heading"><strong>用量筛选</strong><span class="aha-meta">北京时间</span></div>
      <div class="aha-fields">
        <div class="aha-field">
          <span class="aha-label" id="aha-compact-project-label">项目</span>
          <button type="button" class="aha-trigger cursor-interaction" data-project-trigger aria-labelledby="aha-compact-project-label aha-compact-project-value" aria-expanded="true" aria-controls="aha-compact-project-panel"><i data-lucide="folder" aria-hidden="true"></i><span class="aha-value" id="aha-compact-project-value" data-project-value>全部项目</span><i data-lucide="chevron-down" class="aha-chevron" aria-hidden="true"></i></button>
          <div class="aha-popover aha-project-panel" id="aha-compact-project-panel" data-project-panel>
            <div class="aha-search-wrap"><i data-lucide="search" aria-hidden="true"></i><input class="aha-search" type="text" placeholder="搜索项目名称…" aria-label="搜索项目" role="combobox" aria-expanded="true" aria-autocomplete="list" aria-controls="aha-compact-project-list" data-project-search></div>
            <div class="aha-project-list" id="aha-compact-project-list" role="listbox" aria-label="项目" data-project-list></div>
          </div>
        </div>
        <div class="aha-field">
          <span class="aha-label" id="aha-compact-time-label">时间范围</span>
          <button type="button" class="aha-trigger cursor-interaction" data-date-trigger aria-labelledby="aha-compact-time-label aha-compact-time-value" aria-expanded="false" aria-controls="aha-compact-date-panel"><i data-lucide="calendar-days" aria-hidden="true"></i><span class="aha-value" id="aha-compact-time-value" data-date-value>近 7 天</span><i data-lucide="chevron-down" class="aha-chevron" aria-hidden="true"></i></button>
          <span class="aha-date-caption" data-date-caption>10/23 00:00 — 10/29 10:23</span>
          <div class="aha-popover aha-date-panel" id="aha-compact-date-panel" data-date-panel hidden></div>
        </div>
      </div>
      <div class="aha-footer"><div class="aha-scope" role="group" aria-label="用量范围"><button type="button" class="cursor-interaction" aria-pressed="true" data-scope="可用用量">可用用量</button><button type="button" class="cursor-interaction" aria-pressed="false" data-scope="全部用量">全部用量</button></div><button type="button" class="aha-action cursor-interaction" data-apply>更新预览</button></div>
      <p class="aha-status" role="status" aria-live="polite" data-status></p>
    </div>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById('aha-form-directions');
  const projects = ['全部项目', '未归属', 'aha · 用量与费用', 'LiuYing · 资产管理', 'Aventurine · 环保管理'];
  const demoStates = [];
  const saved = window.openai?.widgetState?.modelContent?.selections || {};
  const create = (tag, className, value) => {
    const item = document.createElement(tag);
    if (className) item.className = className;
    if (value !== undefined) item.textContent = value;
    return item;
  };
  const persist = () => {
    if (!window.openai?.setWidgetState) return;
    const selections = {};
    demoStates.forEach(({id, state}) => { selections[id] = {project: state.project, scope: state.scope, preset: state.preset, start: state.start, end: state.end, follow: state.follow}; });
    window.openai.setWidgetState({modelContent: {selections}, privateContent: null}).catch(() => {});
  };
  root.querySelectorAll('[data-demo]').forEach((demo) => {
    const q = (selector) => demo.querySelector(selector);
    const id = demo.dataset.demo;
    const state = {project: '全部项目', scope: '可用用量', preset: '近 7 天', start: '2026-10-23', end: '2026-10-29', follow: true, activeField: 'start', ...saved[id]};
    if (!projects.includes(state.project)) state.project = projects[0];
    const controller = {id, state, refresh: () => {}};
    demoStates.push(controller);
    const projectTrigger = q('[data-project-trigger]');
    const projectPanel = q('[data-project-panel]');
    const search = q('[data-project-search]');
    const list = q('[data-project-list]');
    const dateTrigger = q('[data-date-trigger]');
    const datePanel = q('[data-date-panel]');
    const status = q('[data-status]');
    const closeProjects = (returnFocus = false) => {
      projectPanel.hidden = true; projectTrigger.setAttribute('aria-expanded', 'false'); search.setAttribute('aria-expanded', 'false');
      if (returnFocus) projectTrigger.focus();
    };
    const closeDates = (returnFocus = false) => {
      datePanel.hidden = true; dateTrigger.setAttribute('aria-expanded', 'false');
      if (returnFocus) dateTrigger.focus();
    };
    const updateSummary = () => {
      q('[data-project-value]').textContent = state.project;
      q('[data-date-value]').textContent = state.preset;
      const startTime = state.preset === '近 24 小时' ? '10:23' : '00:00';
      q('[data-date-caption]').textContent = state.preset === '全部' ? '全部已保存日期' : state.start.slice(5).replace('-', '/') + ' ' + startTime + ' — ' + state.end.slice(5).replace('-', '/') + (state.follow ? ' 10:23' : ' 23:59');
      demo.querySelectorAll('[data-scope]').forEach((button) => button.setAttribute('aria-pressed', String(state.scope === button.dataset.scope)));
    };
    const renderProjects = () => {
      list.replaceChildren();
      const matching = projects.filter((project) => project.toLowerCase().includes(search.value.trim().toLowerCase()));
      matching.forEach((project) => {
        const button = create('button', 'aha-option cursor-interaction');
        button.type = 'button'; button.setAttribute('role', 'option'); button.setAttribute('aria-selected', String(project === state.project));
        button.append(create('span', '', project));
        if (project === state.project) { const check = create('i', 'aha-check'); check.dataset.lucide = 'check'; check.setAttribute('aria-hidden', 'true'); button.append(check); }
        button.addEventListener('click', () => { state.project = project; updateSummary(); renderProjects(); closeProjects(true); status.textContent = '已选择：' + project; persist(); });
        list.append(button);
      });
      if (!matching.length) list.append(create('div', 'aha-empty', '没有匹配的项目'));
      if (globalThis.lucide) lucide.createIcons({attrs: {width: 16, height: 16}});
    };
    projectTrigger.addEventListener('click', () => {
      const open = projectPanel.hidden;
      closeDates(); projectPanel.hidden = !open; projectTrigger.setAttribute('aria-expanded', String(open)); search.setAttribute('aria-expanded', String(open));
      if (open) { search.value = ''; renderProjects(); search.focus(); }
    });
    projectTrigger.addEventListener('keydown', (event) => { if (event.key === 'ArrowDown') { event.preventDefault(); if (projectPanel.hidden) projectTrigger.click(); else search.focus(); } });
    search.addEventListener('input', renderProjects);
    projectPanel.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { event.preventDefault(); closeProjects(true); return; }
      const buttons = [...list.querySelectorAll('button')];
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const index = buttons.indexOf(document.activeElement);
        const next = event.key === 'ArrowDown' ? (index + 1) % buttons.length : (index < 0 ? buttons.length - 1 : (index - 1 + buttons.length) % buttons.length);
        buttons[next]?.focus();
      }
      if (event.key === 'Enter' && document.activeElement === search) { event.preventDefault(); buttons[0]?.click(); }
    });
    const renderDates = () => {
      datePanel.replaceChildren();
      const presets = create('div', 'aha-presets');
      ['当天', '近 24 小时', '近 7 天', '近 14 天', '近 30 天', '本月', '全部'].forEach((label) => {
        const button = create('button', 'aha-preset cursor-interaction', label); button.type = 'button'; button.setAttribute('aria-pressed', String(state.preset === label));
        button.addEventListener('click', () => {
          state.preset = label; state.end = '2026-10-29';
          state.start = ({'当天': '2026-10-29', '近 24 小时': '2026-10-28', '近 7 天': '2026-10-23', '近 14 天': '2026-10-16', '近 30 天': '2026-09-30', '本月': '2026-10-01', '全部': '2026-01-01'})[label];
          renderDates();
        }); presets.append(button);
      });
      datePanel.append(presets);
      const fields = create('div', 'aha-time-fields');
      ['start', 'end'].forEach((field) => {
        const button = create('button', 'aha-time-choice cursor-interaction'); button.type = 'button'; button.setAttribute('aria-pressed', String(state.activeField === field));
        const startTime = state.preset === '近 24 小时' ? ' 10:23' : ' 00:00';
        button.append(create('small', '', field === 'start' ? '开始时间' : '结束时间'), create('span', '', state[field].replaceAll('-', '/') + (field === 'start' ? startTime : (state.follow ? ' 10:23' : ' 23:59'))));
        button.addEventListener('click', () => { state.activeField = field; renderDates(); }); fields.append(button);
      }); datePanel.append(fields, create('div', 'aha-month', '2026 年 10 月'));
      const days = create('div', 'aha-days');
      ['日', '一', '二', '三', '四', '五', '六'].forEach((day) => days.append(create('span', 'aha-weekday', day)));
      for (let i = 0; i < 35; i++) {
        const date = new Date(Date.UTC(2026, 8, 27 + i));
        const dateKey = date.toISOString().slice(0, 10);
        const outside = date.getUTCMonth() !== 9;
        const inRange = dateKey > state.start && dateKey < state.end;
        const day = create('button', 'aha-day cursor-interaction' + (outside ? ' outside' : '') + (inRange ? ' in-range' : ''), String(date.getUTCDate()));
        day.type = 'button'; day.setAttribute('aria-label', dateKey); day.setAttribute('aria-pressed', String(dateKey === state.start || dateKey === state.end));
        day.addEventListener('click', () => { state[state.activeField] = dateKey; if (state.end < state.start) state.end = state.start; state.preset = '自定义时间'; state.activeField = state.activeField === 'start' ? 'end' : 'start'; renderDates(); }); days.append(day);
      } datePanel.append(days);
      const bottom = create('div', 'aha-time-bottom');
      const follow = create('label', 'aha-follow'); const checkbox = create('input'); checkbox.type = 'checkbox'; checkbox.checked = state.follow;
      checkbox.addEventListener('change', () => { state.follow = checkbox.checked; renderDates(); }); follow.append(checkbox, create('span', '', '结束时间跟随当前时刻'));
      const confirm = create('button', 'aha-date-confirm cursor-interaction', '确定'); confirm.type = 'button';
      confirm.addEventListener('click', () => { updateSummary(); closeDates(true); status.textContent = '已选择时间：' + state.preset; persist(); }); bottom.append(follow, confirm); datePanel.append(bottom);
    };
    dateTrigger.addEventListener('click', () => { const open = datePanel.hidden; closeProjects(); datePanel.hidden = !open; dateTrigger.setAttribute('aria-expanded', String(open)); if (open) renderDates(); });
    datePanel.addEventListener('keydown', (event) => { if (event.key === 'Escape') { event.preventDefault(); closeDates(true); } });
    demo.querySelectorAll('[data-scope]').forEach((button) => button.addEventListener('click', () => { state.scope = button.dataset.scope; updateSummary(); status.textContent = state.scope === '全部用量' ? '全部用量仅供查看' : '已切换到可用用量'; persist(); }));
    q('[data-apply]').addEventListener('click', () => { closeProjects(); closeDates(); status.textContent = '当前筛选：' + state.project + ' · ' + state.preset + ' · ' + state.scope; persist(); });
    root.addEventListener('click', (event) => { if (!projectTrigger.parentElement.contains(event.target)) closeProjects(); if (!dateTrigger.parentElement.contains(event.target)) closeDates(); }, true);
    controller.refresh = () => { updateSummary(); renderProjects(); if (!datePanel.hidden) renderDates(); };
    updateSummary(); renderProjects();
  });
  window.addEventListener('openai:set_globals', (event) => {
    const incoming = event.detail?.globals?.widgetState?.modelContent?.selections;
    if (!incoming) return;
    demoStates.forEach(({id, state, refresh}) => { if (incoming[id]) { Object.assign(state, incoming[id]); refresh(); } });
  });
  if (globalThis.Tweak) {
    const appearance = {rounding: 10};
    const tweak = new Tweak({container: root, onChange: () => { root.style.setProperty('--aha-rounding', appearance.rounding + 'px'); }});
    tweak.addSlider(appearance, 'rounding', {label: '控件圆角', min: 6, max: 14, step: 1, unit: 'px'});
  }
})();
</script>
