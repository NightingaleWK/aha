[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aha-usage"
version = "0.1.0"
description = "本机 Codex 用量留存与费用证据"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["zstandard==0.25.0"]

[project.scripts]
aha = "aha.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aha = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
